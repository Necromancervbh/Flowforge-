name: 🃏 Card idea
description: Suggest a new WHEN, IF or THEN card
labels: [card idea]
body:
  - type: dropdown
    id: type
    attributes:
      label: Card type
      options: [WHEN (trigger), IF (filter), THEN (action)]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Card name and emoji
      placeholder: e.g. 🌙 Night Shift
  - type: textarea
    id: does
    attributes:
      label: What does it do?
      description: Which settings would it have? Which combo would you build with it?
    validations:
      required: true
