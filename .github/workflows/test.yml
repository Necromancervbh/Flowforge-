name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Launcher starts FlowForge (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: FlowForge.bat --version
      - name: Launcher starts FlowForge (macOS)
        if: runner.os == 'macOS'
        run: ./FlowForge.command --version
      - name: Launcher starts FlowForge (Linux)
        if: runner.os == 'Linux'
        run: ./flowforge.sh --version
